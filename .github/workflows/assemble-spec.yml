name: Assemble DACP specification

on:
  push:
    branches:
      - bootstrap-import
    paths:
      - bootstrap/spec.part.05

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify specification
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/spec.part.* | base64 -d > authoritative/DACP_Heuristics_Specification_0.1.1.md
          echo "8d64973fae52465c046881facdd112893123df781b9fcc47da14f3c5a3d8dbe4  authoritative/DACP_Heuristics_Specification_0.1.1.md" | sha256sum -c -
          git config user.name "DACP Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add authoritative/DACP_Heuristics_Specification_0.1.1.md
          git commit -m "spec: publish Heuristics Specification 0.1.1"
          git push origin HEAD:bootstrap-import
